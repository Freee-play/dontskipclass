<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific & Graphing Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0d19;
    --panel-bg: rgba(20, 24, 45, 0.85);
    --border: rgba(140, 122, 255, 0.25);
    --neon-blue: #00f0ff;
    --neon-purple: #8c7aff;
    --neon-pink: #ff5376;
    --neon-amber: #ffb703;
    --text: #f1effa;
    --muted: #8e95b7;
    --btn-bg: #1c223d;
    --btn-hover: #2a335a;
  }

  body {
    font-family: 'Space Mono', monospace;
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  header {
    text-align: center;
    margin-bottom: 1.5rem;
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 3px;
    color: var(--neon-blue);
    text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
  }

  .subtitle {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 2px;
    margin-top: 4px;
    text-transform: uppercase;
  }

  .calc-wrapper {
    display: flex;
    gap: 1.5rem;
    max-width: 950px;
    width: 100%;
  }

  /* Calculator Main Container */
  .calculator {
    flex: 1;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 1.5rem;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  /* Display Screen */
  .screen {
    background: #060810;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    text-align: right;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 90px;
  }

  .history-text {
    font-size: 0.8rem;
    color: var(--muted);
    min-height: 1.2em;
    overflow: hidden;
    white-space: nowrap;
  }

  .main-display {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.8rem;
    color: var(--neon-blue);
    overflow-x: auto;
    white-space: nowrap;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
  }

  /* Mode Bar */
  .mode-bar {
    display: flex;
    gap: 0.5rem;
  }

  .mode-btn {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.4rem;
    font-family: inherit;
    font-size: 0.75rem;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .mode-btn.active {
    background: var(--neon-purple);
    color: #fff;
    border-color: var(--neon-purple);
    box-shadow: 0 0 10px rgba(140, 122, 255, 0.4);
  }

  /* Keypad Grid */
  .keypad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.6rem;
  }

  button.key {
    font-family: 'Space Mono', monospace;
    font-size: 0.9rem;
    font-weight: 700;
    background: var(--btn-bg);
    color: var(--text);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    padding: 0.85rem 0.2rem;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }

  button.key:hover {
    background: var(--btn-hover);
    border-color: var(--neon-purple);
    transform: translateY(-2px);
  }

  button.key:active {
    transform: translateY(0);
  }

  button.key.op { color: var(--neon-blue); }
  button.key.sci { color: var(--neon-purple); font-size: 0.8rem; }
  button.key.danger { color: var(--neon-pink); }
  button.key.equals {
    background: var(--neon-purple);
    color: #fff;
    grid-column: span 2;
    box-shadow: 0 0 15px rgba(140, 122, 255, 0.4);
  }

  /* Graphing Panel */
  .graph-panel {
    flex: 1.1;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }

  .graph-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9rem;
    color: var(--neon-amber);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .graph-input-group {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  .graph-input-group span {
    color: var(--neon-blue);
    font-weight: 700;
  }

  input[type="text"] {
    flex: 1;
    background: #060810;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 0.5rem 0.8rem;
    font-family: inherit;
    font-size: 0.85rem;
    outline: none;
  }

  input[type="text"]:focus {
    border-color: var(--neon-blue);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
  }

  #graphCanvas {
    width: 100%;
    height: 300px;
    background: #060810;
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .preset-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.3rem 0.6rem;
    font-family: inherit;
    font-size: 0.7rem;
    border-radius: 6px;
    cursor: pointer;
  }

  .preset-btn:hover {
    color: var(--text);
    border-color: var(--neon-amber);
  }

  @media (max-width: 850px) {
    .calc-wrapper { flex-direction: column; }
    #graphCanvas { height: 240px; }
  }
</style>
</head>
<body>

<header>
  <h1>Scientific & Graphing Engine</h1>
  <div class="subtitle">Interactive Physics & Math Calculator</div>
</header>

<div class="calc-wrapper">
  <!-- CALCULATOR PANEL -->
  <div class="calculator">
    <div class="screen">
      <div class="history-text" id="historyDisplay"></div>
      <div class="main-display" id="mainDisplay">0</div>
    </div>

    <div class="mode-bar">
      <button class="mode-btn active" id="degBtn">DEG</button>
      <button class="mode-btn" id="radBtn">RAD</button>
    </div>

    <div class="keypad">
      <!-- Row 1 -->
      <button class="key danger" onclick="clearAll()">AC</button>
      <button class="key danger" onclick="deleteChar()">DEL</button>
      <button class="key sci" onclick="appendInput('(')">(</button>
      <button class="key sci" onclick="appendInput(')')">)</button>
      <button class="key op" onclick="appendInput('/')">÷</button>

      <!-- Row 2 -->
      <button class="key sci" onclick="appendFunc('sin')">sin</button>
      <button class="key sci" onclick="appendFunc('cos')">cos</button>
      <button class="key sci" onclick="appendFunc('tan')">tan</button>
      <button class="key sci" onclick="appendInput('^')">x^y</button>
      <button class="key op" onclick="appendInput('*')">×</button>

      <!-- Row 3 -->
      <button class="key sci" onclick="appendFunc('sqrt')">√</button>
      <button class="key" onclick="appendInput('7')">7</button>
      <button class="key" onclick="appendInput('8')">8</button>
      <button class="key" onclick="appendInput('9')">9</button>
      <button class="key op" onclick="appendInput('-')">-</button>

      <!-- Row 4 -->
      <button class="key sci" onclick="appendFunc('log')">log</button>
      <button class="key" onclick="appendInput('4')">4</button>
      <button class="key" onclick="appendInput('5')">5</button>
      <button class="key" onclick="appendInput('6')">6</button>
      <button class="key op" onclick="appendInput('+')">+</button>

      <!-- Row 5 -->
      <button class="key sci" onclick="appendInput('Math.PI')">π</button>
      <button class="key" onclick="appendInput('1')">1</button>
      <button class="key" onclick="appendInput('2')">2</button>
      <button class="key" onclick="appendInput('3')">3</button>
      <button class="key equals" onclick="calculate()">=</button>

      <!-- Row 6 -->
      <button class="key sci" onclick="appendInput('Math.E')">e</button>
      <button class="key" onclick="appendInput('0')">0</button>
      <button class="key" onclick="appendInput('.')">.</button>
    </div>
  </div>

  <!-- GRAPHING PANEL -->
  <div class="graph-panel">
    <div class="graph-title">2D Function Plotter</div>
    <div class="graph-input-group">
      <span>f(x) =</span>
      <input type="text" id="funcInput" value="Math.sin(x)" placeholder="e.g. Math.sin(x) or x*x">
    </div>

    <div>
      <span style="font-size: 0.7rem; color: var(--muted); margin-right: 6px;">Presets:</span>
      <button class="preset-btn" onclick="setGraph('Math.sin(x)')">sin(x)</button>
      <button class="preset-btn" onclick="setGraph('x*x - 3')">x² - 3</button>
      <button class="preset-btn" onclick="setGraph('Math.cos(x*2)')">cos(2x)</button>
    </div>

    <canvas id="graphCanvas"></canvas>
  </div>
</div>

<script>
  // Calculator State
  let expr = '';
  let isRad = false;

  const mainDisplay = document.getElementById('mainDisplay');
  const historyDisplay = document.getElementById('historyDisplay');
  const degBtn = document.getElementById('degBtn');
  const radBtn = document.getElementById('radBtn');

  // Angle Modes
  degBtn.addEventListener('click', () => {
    isRad = false;
    degBtn.classList.add('active');
    radBtn.classList.remove('active');
  });

  radBtn.addEventListener('click', () => {
    isRad = true;
    radBtn.classList.add('active');
    degBtn.classList.remove('active');
  });

  function updateDisplay() {
    mainDisplay.textContent = expr || '0';
  }

  function appendInput(val) {
    expr += val;
    updateDisplay();
  }

  function appendFunc(funcName) {
    expr += funcName + '(';
    updateDisplay();
  }

  function clearAll() {
    expr = '';
    historyDisplay.textContent = '';
    updateDisplay();
  }

  function deleteChar() {
    expr = expr.slice(0, -1);
    updateDisplay();
  }

  function calculate() {
    try {
      historyDisplay.textContent = expr + ' =';
      let parsedExpr = expr
        .replace(/sin\(/g, isRad ? 'Math.sin(' : 'sinDeg(')
        .replace(/cos\(/g, isRad ? 'Math.cos(' : 'cosDeg(')
        .replace(/tan\(/g, isRad ? 'Math.tan(' : 'tanDeg(')
        .replace(/log\(/g, 'Math.log10(')
        .replace(/sqrt\(/g, 'Math.sqrt(')
        .replace(/\^/g, '**');

      // Helper trig functions for Degrees
      window.sinDeg = (deg) => Math.sin((deg * Math.PI) / 180);
      window.cosDeg = (deg) => Math.cos((deg * Math.PI) / 180);
      window.tanDeg = (deg) => Math.tan((deg * Math.PI) / 180);

      let result = eval(parsedExpr);
      if (typeof result === 'number' && !isNaN(result)) {
        expr = result.toString();
      } else {
        expr = 'Error';
      }
    } catch (e) {
      expr = 'Error';
    }
    updateDisplay();
  }

  // --- Graphing Canvas Engine ---
  const canvas = document.getElementById('graphCanvas');
  const ctx = canvas.getContext('2d');
  const funcInput = document.getElementById('funcInput');

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth - 48;
    canvas.height = 300;
    plotGraph();
  }
  window.addEventListener('resize', resizeCanvas);

  function setGraph(formula) {
    funcInput.value = formula;
    plotGraph();
  }

  funcInput.addEventListener('input', plotGraph);

  function plotGraph() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const w = canvas.width;
    const h = canvas.height;
    const centerX = w / 2;
    const centerY = h / 2;
    const scale = 30; // 30 pixels = 1 unit

    // Grid Lines
    ctx.strokeStyle = 'rgba(140, 122, 255, 0.15)';
    ctx.lineWidth = 1;

    for (let x = 0; x < w; x += scale) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = 0; y < h; y += scale) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // Axes
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, centerY); ctx.lineTo(w, centerY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(centerX, 0); ctx.lineTo(centerX, h); ctx.stroke();

    // Plot User Function
    const code = funcInput.value;
    ctx.strokeStyle = '#ffb703';
    ctx.lineWidth = 2;
    ctx.beginPath();

    let isDrawing = false;

    for (let px = 0; px <= w; px++) {
      let x = (px - centerX) / scale;
      let y;
      try {
        y = eval(code);
      } catch (e) {
        return;
      }

      if (typeof y === 'number' && !isNaN(y) && isFinite(y)) {
        let py = centerY - y * scale;
        if (!isDrawing) {
          ctx.moveTo(px, py);
          isDrawing = true;
        } else {
          ctx.lineTo(px, py);
        }
      } else {
        isDrawing = false;
      }
    }
    ctx.stroke();
  }

  // Initial setup
  resizeCanvas();
</script>
</body>
</html>
